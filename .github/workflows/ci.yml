name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_CONVERSATION_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run verify:web

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: insurance_operations_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insurance_operations_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENVIRONMENT: test
      API_HOST: 127.0.0.1
      API_PORT: 8000
      WEB_ORIGIN: http://localhost:3000
      WORKER_NAME: ci-worker
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/insurance_operations_development
      DIRECT_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/insurance_operations_development
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/insurance_operations_test
      DATABASE_SSL_MODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy apps/backend/src tests
      - run: pytest
      - run: insurance-operations-worker --check
